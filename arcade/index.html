<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arcade · Toybox</title>
  <meta name="description" content="60-second language rounds: tap the right answer before the card hits the line. Nothing is saved.">
  <meta name="theme-color" content="#0b0a12">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Arcade · Toybox">
  <meta property="og:description" content="60-second language rounds: tap the right answer before the card hits the line.">
  <meta property="og:url" content="https://nanyan4.github.io/toybox/arcade/">
  <meta property="og:image" content="https://nanyan4.github.io/toybox/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/toybox/toybox-icon-32.png?v=4">
  <link rel="icon" type="image/png" sizes="180x180" href="/toybox/toybox-icon-180.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/toybox/toybox-icon-180.png?v=4">
  <style>
    :root {
      --bg: #0b0a12; --bg-2: #15131f; --panel: #1c1a29; --line: #2c2940; --text: #f4f2ff; --text-2: #a9a4c4;
      --neon: #7c5cff; --neon-rgb: 124, 92, 255; --hot: #ff4fa3; --cyan: #2ee6d6; --gold: #ffd23f; --miss: #ff5d5d;
      --ff: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --beat: 0.5s;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--ff); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
    a { color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Top bar ---------- */
    .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; max-width: 960px; margin: 0 auto; }
    .home { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; padding: 6px 10px 6px 6px; border-radius: 12px; }
    .home:hover { background: var(--bg-2); }
    .home svg { width: 18px; height: 18px; }
    .spacer { flex: 1; }
    .pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--bg-2); font-size: 13px; font-weight: 700; color: var(--text-2); }
    .pill-btn[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 0 0 1.5px var(--cyan); }
    .pill-btn svg { width: 16px; height: 16px; }
    .pill-btn { white-space: nowrap; }
    @media (max-width: 520px) { .pill-btn .txt { display: none; } .pill-btn { padding: 8px 11px; font-size: 15px; } }
    .lang-sel { background: var(--bg-2); color: var(--text-2); border: 0; border-radius: 999px; padding: 8px 10px; font: inherit; font-size: 13px; font-weight: 700; }

    /* ---------- Lobby ---------- */
    .lobby { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; }
    .lobby h1 { font-size: clamp(34px, 9vw, 64px); line-height: 1; margin: 12px 0 6px; letter-spacing: -0.03em; font-weight: 900; font-style: italic;
      background: linear-gradient(90deg, var(--cyan), var(--neon), var(--hot)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tagline { color: var(--text-2); margin: 0 0 18px; }
    .lang-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
    .lang-tabs::-webkit-scrollbar { display: none; }
    .lang-tab { flex: none; padding: 10px 16px; border-radius: 14px; background: var(--bg-2); font-weight: 800; font-size: 16px; color: var(--text-2); transition: transform 0.15s, box-shadow 0.15s; }
    .lang-tab[aria-selected="true"] { color: var(--text); box-shadow: inset 0 0 0 2px var(--neon), 0 0 18px rgba(var(--neon-rgb), 0.45); }
    .lang-tab:hover { transform: translateY(-1px); }

    .wheel-wrap { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 8px; }
    @media (min-width: 760px) { .wheel-wrap { grid-template-columns: 1.2fr 1fr; align-items: center; } }
    .wheel { position: relative; height: 380px; overflow: hidden; perspective: 900px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
      mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
    .track { position: absolute; left: 8px; right: 8px; top: 50%; height: 76px; margin-top: -38px; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-radius: 16px; background: var(--panel); text-align: left; transform-origin: left center; transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.28s, box-shadow 0.2s;
      box-shadow: inset 0 0 0 1px var(--line); }
    .track.sel { box-shadow: inset 0 0 0 2px var(--neon), 0 0 28px rgba(var(--neon-rgb), 0.55); animation: neon var(--beat) ease-in-out infinite alternate; }
    .track:hover { box-shadow: inset 0 0 0 2px var(--cyan); }
    @keyframes neon { to { box-shadow: inset 0 0 0 2px var(--hot), 0 0 38px rgba(255, 79, 163, 0.55); } }
    .track-num { width: 34px; font-weight: 900; font-size: 20px; color: var(--text-2); font-variant-numeric: tabular-nums; font-style: italic; }
    .track-text { flex: 1; min-width: 0; }
    .track-title { display: block; font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-sub { display: block; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bpm { flex: none; text-align: right; font-weight: 900; font-style: italic; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
    .bpm small { display: block; font-size: 10px; letter-spacing: 0.12em; color: var(--text-2); font-style: normal; }
    .lv { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 900; margin-right: 6px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
    .dtag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: #0b0a12; }
    .EASY.dtag, .diff.EASY[aria-pressed="true"] { background: var(--cyan); color: #0b0a12; }
    .NORMAL.dtag, .diff.NORMAL[aria-pressed="true"] { background: #8be36b; color: #0b0a12; }
    .HARD.dtag, .diff.HARD[aria-pressed="true"] { background: var(--gold); color: #0b0a12; }
    .EXTREME.dtag, .diff.EXTREME[aria-pressed="true"] { background: linear-gradient(90deg, var(--hot), var(--neon)); color: #fff; }
    .diffs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .diff { padding: 11px 2px; border-radius: 12px; background: var(--bg-2); font-weight: 900; font-size: 12px; letter-spacing: 0.04em; color: var(--text-2); box-shadow: inset 0 0 0 1.5px var(--line); }
    .diff[aria-pressed="true"] { box-shadow: 0 0 16px rgba(var(--neon-rgb), 0.45); }
    .diff-label { font-size: 12px; font-weight: 800; color: var(--text-2); letter-spacing: 0.06em; }
    .diff-hint { margin: -4px 0 0; color: var(--text-2); font-size: 13px; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mode { padding: 11px 6px; border-radius: 12px; background: var(--bg-2); font-weight: 800; font-size: 14px; color: var(--text-2); box-shadow: inset 0 0 0 1.5px var(--line); }
    .mode-est { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--text-2); }
    .mode[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan), 0 0 14px rgba(46, 230, 214, 0.35); }
    .best { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--bg-2); }
    .best-rank { font-size: 30px; font-weight: 900; font-style: italic; min-width: 52px; text-align: center; }
    .best-text { display: grid; gap: 2px; font-size: 13px; color: var(--text-2); font-weight: 700; }
    .best-text b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
    .track-best { flex: none; font-weight: 900; font-style: italic; font-size: 15px; min-width: 30px; text-align: center; }
    .r-SSS { background: linear-gradient(90deg, var(--gold), var(--hot), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .r-S { color: var(--gold); } .r-A { color: var(--cyan); } .r-B { color: #8be36b; } .r-F { color: var(--miss); }
    .score { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; pointer-events: none; z-index: 0; opacity: 0.9; }
    .newrec { justify-self: center; padding: 6px 14px; border-radius: 999px; font-weight: 900; letter-spacing: 0.1em; color: #0b0a12; background: linear-gradient(90deg, var(--cyan), var(--gold)); animation: rankIn 0.6s 0.45s both; }
    .result-score { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .result-note { color: var(--text-2); font-size: 14px; margin: 0; }
    .paused { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11, 10, 18, 0.82); z-index: 4; font-weight: 900; font-size: 22px; text-align: center; padding: 20px; }
    .paused[hidden] { display: none; }
    .detail { padding: 18px; border-radius: 20px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 12px; }
    .detail-lang { font-weight: 800; color: var(--text-2); }
    .detail-title { font-size: 30px; font-weight: 900; margin: 0; line-height: 1.1; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--text-2); font-weight: 700; }
    .detail-how { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.5; }
    .play-btn { padding: 18px; border-radius: 18px; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #fff;
      background: linear-gradient(90deg, var(--neon), var(--hot)); box-shadow: 0 0 30px rgba(255, 79, 163, 0.45); animation: glow var(--beat) ease-in-out infinite alternate; }
    @keyframes glow { to { box-shadow: 0 0 46px rgba(124, 92, 255, 0.7); } }
    .study-link { justify-self: center; color: var(--text-2); font-size: 14px; font-weight: 700; }
    .wheel-nav { display: flex; gap: 8px; justify-content: center; }
    .wheel-nav button { width: 44px; height: 44px; border-radius: 12px; background: var(--bg-2); font-size: 18px; }

    /* ---------- Game ---------- */
    .game { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: radial-gradient(ellipse at 50% 120%, rgba(var(--neon-rgb), 0.25), transparent 60%), var(--bg);
      padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 10px); }
    .game[hidden] { display: none; }
    .hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 16px 6px; max-width: 760px; width: 100%; margin: 0 auto; }
    .hud-close { width: 40px; height: 40px; border-radius: 12px; background: var(--bg-2); font-size: 18px; }
    .timebar { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
    .timebar span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--cyan), var(--neon), var(--hot)); transform-origin: left; }
    .hud-time { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
    .stage { position: relative; overflow: hidden; max-width: 760px; width: 100%; margin: 0 auto; }
    .lanes-bg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; opacity: 0.5; }
    .lanes-bg i { border-left: 1px solid rgba(255,255,255,0.05); }
    .hitline { position: absolute; left: 12px; right: 12px; top: 86%; height: 4px; border-radius: 4px; background: var(--hot); box-shadow: 0 0 14px var(--hot); }
    .hitline.pulse { animation: hl 0.18s ease-out; }
    @keyframes hl { from { transform: scaleY(2.6); box-shadow: 0 0 30px var(--hot); } }
    .note { position: absolute; z-index: 1; left: 50%; top: 0; width: min(560px, calc(100% - 32px)); transform: translate(-50%, 0); padding: 14px 18px; border-radius: 18px;
      background: linear-gradient(180deg, #262340, #1c1a2c); box-shadow: inset 0 0 0 2px rgba(var(--neon-rgb), 0.8), 0 10px 30px rgba(0,0,0,0.4); text-align: center; will-change: transform; }
    .note-label { display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--cyan); text-transform: uppercase; }
    .note-main { display: block; font-weight: 800; font-size: clamp(22px, 6vw, 34px); line-height: 1.3; word-break: break-word; }
    .note-main.big { font-size: clamp(44px, 14vw, 72px); line-height: 1.1; }
    .note-main.long { font-size: clamp(17px, 4.6vw, 22px); }
    .note-main .gap { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--hot); }
    .note-sub { display: block; margin-top: 6px; color: var(--text-2); font-size: 14px; }
    .note.hit { animation: noteHit 0.28s ease-out forwards; }
    .note.missed { animation: noteMiss 0.45s ease-in forwards; }
    @keyframes noteHit { to { transform: translate(-50%, var(--y)) scale(1.15); opacity: 0; } }
    @keyframes noteMiss { to { transform: translate(-50%, calc(var(--y) + 40px)) rotate(4deg); opacity: 0; filter: grayscale(1); } }
    .judge { position: absolute; z-index: 2; left: 16px; right: 16px; top: 40%; transform-origin: center; text-align: center; font-weight: 900; font-style: italic; font-size: clamp(32px, 10vw, 54px); pointer-events: none; letter-spacing: 0.02em; }
    .judge.show { animation: pop 0.55s cubic-bezier(.2,1.6,.4,1) forwards; }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1) translateY(-14px); opacity: 0; } }
    .judge.PERFECT { color: var(--gold); text-shadow: 0 0 18px rgba(255, 210, 63, 0.7); }
    .judge.GREAT { color: var(--cyan); text-shadow: 0 0 14px rgba(46, 230, 214, 0.6); }
    .judge.GOOD { color: #8be36b; }
    .judge.MISS { color: var(--miss); }
    .judge .judge-ans { display: block; margin-top: 6px; font-size: 18px; font-style: normal; font-weight: 800; color: var(--text); letter-spacing: 0; word-break: break-word; }
    .combo { position: absolute; top: 46%; right: 16px; z-index: 0; opacity: 0.85; text-align: right; font-weight: 900; font-style: italic; line-height: 1; pointer-events: none; }
    .combo b { display: block; font-size: 44px; font-variant-numeric: tabular-nums; }
    .combo small { font-size: 12px; letter-spacing: 0.15em; color: var(--text-2); }
    .combo.bump b { animation: bump 0.18s ease-out; }
    @keyframes bump { from { transform: scale(1.35); } }
    .shard { position: absolute; font-weight: 900; font-style: italic; font-size: 44px; color: var(--miss); pointer-events: none; animation: shard 0.6s ease-in forwards; }
    @keyframes shard { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
    .fever-tag { position: absolute; top: 12px; left: 16px; font-weight: 900; font-style: italic; letter-spacing: 0.1em; color: var(--gold); opacity: 0; pointer-events: none; }
    .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px 0; max-width: 760px; width: 100%; margin: 0 auto; }
    @media (min-width: 700px) { .lanes { grid-template-columns: repeat(4, 1fr); } }
    .lane { position: relative; min-height: 76px; padding: 10px 12px 10px 30px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line), 0 4px 0 #09080f;
      font-weight: 800; font-size: 17px; line-height: 1.25; text-align: center; word-break: break-word; transition: transform 0.06s; display: flex; align-items: center; justify-content: center; }
    .lane:active, .lane.down { transform: translateY(3px); box-shadow: inset 0 0 0 1.5px var(--neon), 0 1px 0 #09080f; }
    .lane .key { position: absolute; left: 10px; top: 8px; font-size: 11px; color: var(--text-2); font-weight: 900; }
    .lane.big { font-size: 28px; }
    .lane.small { font-size: 14px; }
    .lane.right { box-shadow: inset 0 0 0 2.5px var(--cyan), 0 0 22px rgba(46, 230, 214, 0.45); }
    .lane.wrong { box-shadow: inset 0 0 0 2.5px var(--miss); }
    .spark { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 5; animation: spark 0.6s ease-out forwards; }
    @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }
    .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; font-weight: 900; font-style: italic; pointer-events: none; }
    .count span { animation: pop 0.5s ease-out forwards; }
    .shake { animation: shake 0.15s linear; }
    @keyframes shake { 25% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 75% { transform: translate(1px, 2px); } }

    /* Fever: high contrast, a border that glows on the beat */
    .game.fever { background: #000; }
    .game.fever .stage::after { content: ''; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 40px rgba(255, 210, 63, 0.35); animation: feverGlow var(--beat) ease-in-out infinite alternate; }
    .game.fever2 .stage::after { box-shadow: inset 0 0 0 4px var(--hot), inset 0 0 60px rgba(255, 79, 163, 0.45); }
    @keyframes feverGlow { from { opacity: 0.35; } to { opacity: 1; } }
    .game.fever .fever-tag { opacity: 1; }
    .game.fever .note { background: #000; box-shadow: inset 0 0 0 2px var(--gold); }
    .game.fever .lane { background: #000; box-shadow: inset 0 0 0 1.5px #fff, 0 4px 0 #333; }

    /* ---------- Result ---------- */
    .result { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 30%, rgba(var(--neon-rgb), 0.35), transparent 60%), var(--bg); overflow-y: auto; }
    .result[hidden] { display: none; }
    .result-card { width: min(440px, 100%); text-align: center; display: grid; gap: 14px; }
    .result-track { color: var(--text-2); font-weight: 800; }
    .rank { font-size: clamp(110px, 34vw, 170px); font-weight: 900; font-style: italic; line-height: 0.9; animation: rankIn 0.7s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes rankIn { from { transform: scale(2.4) rotate(-12deg); opacity: 0; filter: blur(8px); } }
    .rank.SSS { background: linear-gradient(90deg, var(--gold), var(--hot), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .rank.S { color: var(--gold); text-shadow: 0 0 30px rgba(255, 210, 63, 0.5); }
    .rank.A { color: var(--cyan); } .rank.B { color: #8be36b; } .rank.F { color: var(--miss); }
    .fc { justify-self: center; padding: 6px 14px; border-radius: 999px; font-weight: 900; letter-spacing: 0.1em; color: #0b0a12; background: linear-gradient(90deg, var(--gold), var(--hot)); animation: rankIn 0.6s 0.3s both; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 14px; border-radius: 16px; background: var(--panel); }
    .stat b { display: block; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--text-2); font-size: 13px; font-weight: 700; }
    .again { padding: 20px; border-radius: 20px; font-size: 24px; font-weight: 900; letter-spacing: 0.06em; color: #fff; background: linear-gradient(90deg, var(--neon), var(--hot));
      box-shadow: 0 0 36px rgba(255, 79, 163, 0.55); animation: glow 0.55s ease-in-out infinite alternate; }
    .again small { display: block; font-size: 12px; opacity: 0.8; letter-spacing: 0.15em; }
    .to-tracks { color: var(--text-2); font-weight: 700; }
    .msg { color: var(--text-2); text-align: center; padding: 24px; }

    /* Calm mode (and reduced-motion users): no flashing, shaking or sparks */
    .calm .track.sel, .calm .play-btn, .calm .again { animation: none; }
    .calm .game.fever .stage::after { animation: none; opacity: 0.8; }
    .calm .judge.show { animation: fadeJudge 0.5s forwards; }
    @keyframes fadeJudge { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
    .calm .hitline.pulse, .calm .combo.bump b, .calm .rank, .calm .fc { animation: none; }
  </style>
</head>
<body>
  <header class="top">
    <a class="home" href="../" id="home"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Toybox</span></a>
    <span class="spacer"></span>
    <button type="button" class="pill-btn" id="music-btn" aria-pressed="true"></button>
    <button type="button" class="pill-btn" id="sound-btn" aria-pressed="true"></button>
    <button type="button" class="pill-btn" id="calm-btn" aria-pressed="false"></button>
    <select class="lang-sel" id="lang" aria-label="Language"></select>
  </header>

  <main class="lobby" id="lobby">
    <h1>ARCADE</h1>
    <p class="tagline" id="tagline"></p>
    <div class="lang-tabs" role="tablist" id="tabs"></div>
    <div class="wheel-wrap">
      <div>
        <div class="wheel" id="wheel" aria-live="polite"></div>
        <div class="wheel-nav"><button type="button" id="up" aria-label="Previous">▲</button><button type="button" id="down" aria-label="Next">▼</button></div>

      ] }
    ];
    // Difficulty chosen by the player: tempo, time for a card to fall, and the PERFECT / GREAT windows
    const DIFFS = {
      EASY: { bpm: 0.8, fall: 1.5, win: [0.45, 0.75] },
      NORMAL: { bpm: 1, fall: 1, win: [0.35, 0.65] },
      HARD: { bpm: 1.15, fall: 0.8, win: [0.3, 0.6] },

    const DIFF_IDS = Object.keys(DIFFS);
    // Track level from its base tempo: 90 BPM is Lv.1, 150 BPM is Lv.7
    const lvOf = t => 1 + Math.round((t.bpm - 90) / 10);
    // Card counts per track, filled in when a track's data has been loaded (shown as "…" before)
    const COUNTS = {};
    const lvCount = (c, t) => COUNTS[c.id + '/' + t.id] || 0;
    // Rough playing time of an all-cards run: per card, half a beat waiting for the spawn, about 45% of
    // the fall time to answer, and the short pause after a hit; plus ~10% for missed cards coming back
    function estMinutes(c, t) {
      const n = lvCount(c, t);
      if (!n) return 0;
      const beat = 60000 / bpmOf(t), fall = beat * FALL_BEATS[t.kind] * DIFFS[prefs.diff].fall;
      return (n * 1.1 * (0.5 * beat + 0.45 * fall + 260)) / 60000;
    }
    // How many beats a card takes to reach the line: longer prompts get more time
    const FALL_BEATS = { script: 6, tones: 6, zh: 8, sent: 14 };

    // ---------- Language and prefs ----------
    const LANG_IDS = I18N.langs.map(l => l.id);
    function detectLang() {
      let stored = null;
      try { stored = localStorage.getItem(LANG_KEY); } catch (e) {}
      if (stored && LANG_IDS.includes(stored)) return stored;
      for (const l of navigator.languages || [navigator.language || 'en']) {
        const x = l.toLowerCase();
        const id = x.startsWith('zh') ? 'zh-Hans' : x.split('-')[0];
        if (LANG_IDS.includes(id)) return id;
      }
      return 'en';
    }
    let lang = detectLang();
    let T = I18N.ui[lang];
    const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const prefs = Object.assign({ sound: true, music: true, calm: reducedMotion, diff: 'NORMAL', mode: 'time' }, store.get(PREFS_KEY) || {});
    if (!['time', 'all'].includes(prefs.mode)) prefs.mode = 'time';
    if (!DIFFS[prefs.diff]) prefs.diff = 'NORMAL';
    const bpmOf = t => Math.round(t.bpm * DIFFS[prefs.diff].bpm);
    const pick = f => f[lang] || f.en;

    // ---------- Sound (Web Audio, synthesized; no files) ----------
    const SCALE = [261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88]; // C4 D4 E4 F4 G4 A4 B4
    const Audio = {
      ctx: null, out: null, noiseBuf: null, keepAlive: null,
      // Called from a tap or key press: browsers only start audio after a user gesture
      init() {
        // iPhones mute Web Audio with the silent switch; ask for "playback" audio where Safari supports it
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        if (!this.ctx) {
          try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            // Everything goes through a compressor so loud hits don't clip and quiet ones stay audible
            const comp = this.ctx.createDynamicsCompressor();
            const master = this.ctx.createGain(); master.gain.value = 0.9;
            master.connect(comp).connect(this.ctx.destination);
            this.out = master;
            const len = this.ctx.sampleRate * 0.5;
            this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = this.noiseBuf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          } catch (e) { this.ctx = null; return; }
        }
        if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
        // A silent one-sample sound unlocks audio on older iPhones
        try { const src = this.ctx.createBufferSource(); src.buffer = this.ctx.createBuffer(1, 1, 22050); src.connect(this.ctx.destination); src.start(0); } catch (e) {}
        // Older iPhones without audioSession: a looping silent media element moves audio out of "ringer" mode
        if (!navigator.audioSession && /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
          try {
            if (!this.keepAlive) { this.keepAlive = document.createElement('audio'); this.keepAlive.src = silentWav(); this.keepAlive.loop = true; this.keepAlive.setAttribute('playsinline', ''); }
            const pr = this.keepAlive.play(); if (pr) pr.catch(() => {});
          } catch (e) {}
        }
      },
      rest() { try { if (this.keepAlive) this.keepAlive.pause(); } catch (e) {} },
      env(node, t, vol, dur) {
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        node.connect(g).connect(this.out);
        return g;
      },
      noise(t, dur, vol, type, freq) {
        const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
        const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
        s.connect(f); this.env(f, t, vol, dur); s.start(t); s.stop(t + dur + 0.02);
        return f;
      },
      ok() { return prefs.sound && this.ctx && this.ctx.state === 'running'; },
      // Kick: a falling tone plus a click, so phone speakers (which drop low notes) still hear the beat
      kick() {
        if (!this.ok()) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator();
        o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
        this.env(o, t, 0.5, 0.15); o.start(t); o.stop(t + 0.17);
        this.noise(t, 0.02, 0.25, 'bandpass', 1800);
      },
      hat() { if (this.ok()) this.noise(this.ctx.currentTime, 0.04, 0.12, 'highpass', 6000); },
      // A drum hit whose pitch climbs one scale step per combo (C, D, E, …), an octave up for small speakers
      hit(combo) {
        if (!this.ok()) return;
        const t = this.ctx.currentTime, step = Math.min(combo - 1, 20);
        const freq = SCALE[step % 7] * 2 * Math.pow(2, Math.floor(step / 7));
        const o = this.ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
        this.env(o, t, 0.55, 0.22); o.start(t); o.stop(t + 0.24);
        const o2 = this.ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
        this.env(o2, t, 0.15, 0.12); o2.start(t); o2.stop(t + 0.14);
        this.noise(t, 0.03, 0.2, 'bandpass', 3000);
      },
      // A record scratch: noise and a falling saw, swept down
      scratch() {
        if (!this.ok()) return;
        const t = this.ctx.currentTime;
        const f = this.noise(t, 0.3, 0.45, 'bandpass', 2400);
        f.frequency.exponentialRampToValueAtTime(250, t + 0.3); f.Q.value = 3;
        const o = this.ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.28);
        this.env(o, t, 0.18, 0.3); o.start(t); o.stop(t + 0.32);
      },
      // A short "click" for each step of the wheel (drrrr when dragged)
      tick(high) {
        if (!this.ok()) return;
        const t = this.ctx.currentTime;
        this.noise(t, 0.018, 0.3, 'highpass', high ? 4000 : 2500);
        const o = this.ctx.createOscillator(); o.frequency.setValueAtTime(high ? 2600 : 2000, t); o.frequency.exponentialRampToValueAtTime(high ? 1700 : 1300, t + 0.03);
        this.env(o, t, 0.1, 0.035); o.start(t); o.stop(t + 0.04);
      },
      // Timed voices for the music: they play at time t on the audio clock
      tone(freq, t, dur, vol, type, lp) {
        const o = this.ctx.createOscillator(); o.type = type || 'triangle'; o.frequency.value = freq;
        let node = o;
        if (lp) { const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
        this.env(node, t, vol, dur); o.start(t); o.stop(t + dur + 0.02);
      },
      kickAt(t, vol) {
        const o = this.ctx.createOscillator();
        o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
        this.env(o, t, vol, 0.15); o.start(t); o.stop(t + 0.17);
        this.noise(t, 0.015, vol * 0.4, 'bandpass', 1800);
      },
      fever() {
        if (!this.ok()) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((fq, i) => {
          const o = this.ctx.createOscillator(); o.type = 'square'; o.frequency.value = fq;
          this.env(o, t + i * 0.06, 0.12, 0.15); o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.17);
        });
      }
    };
    // ---------- Music: a synthesized loop (Am F C G) at the track's tempo ----------
    const CHORDS = [
      { root: 110.0, tones: [440.0, 523.25, 659.25] },   // A minor
      { root: 87.31, tones: [349.23, 440.0, 523.25] },   // F
      { root: 130.81, tones: [523.25, 659.25, 783.99] }, // C
      { root: 98.0, tones: [392.0, 493.88, 587.33] }     // G
    ];
    const Music = {
      timer: null, next: 0, step: 0, bpm: 120, mode: 'lobby', fever: 0,
      playing() { return !!this.timer; },
      // mode: 'lobby' (soft) or 'game' (full beat); at: audio time of the first step
      start(bpm, mode, at) {
        this.stop();
        if (!prefs.music || !Audio.ctx || Audio.ctx.state !== 'running') return;
        this.bpm = bpm; this.mode = mode; this.step = 0; this.fever = 0;
        this.next = at || Audio.ctx.currentTime + 0.06;
        this.timer = setInterval(() => this.schedule(), 25);
        this.schedule();
      },
      stop() { clearInterval(this.timer); this.timer = null; },
      // Look a little ahead and queue sixteenth-note steps on the audio clock, so timing stays tight
      schedule() {
        const ctx = Audio.ctx;

        if (this.next < ctx.currentTime - 0.2) this.next = ctx.currentTime + 0.02;
        while (this.next < ctx.currentTime + 0.12) { this.play(this.step, this.next, six); this.next += six; this.step++; }
      },
      play(i, t, six) {
        const pos = i % 16, ch = CHORDS[Math.floor(i / 16) % 4], A = Audio;
        if (this.mode === 'game') {
          if (pos % 4 === 0) A.kickAt(t, 0.5);
          if (pos === 4 || pos === 12) A.noise(t, 0.09, 0.22, 'bandpass', 1500);
          if (pos % 4 === 2 || (this.fever && pos % 2 === 1)) A.noise(t, 0.03, 0.09, 'highpass', 7000);
          if (pos % 2 === 0) { A.tone(ch.root, t, six * 1.6, 0.2, 'sawtooth', 700); A.tone(ch.root * 2, t, six * 1.2, 0.07, 'sine'); }
          if (pos % 2 === 1 || this.fever >= 2) A.tone(ch.tones[(i >> 1) % 3] * (this.fever ? 2 : 1), t, six * 0.9, 0.06, 'triangle');
        } else {
          if (pos === 0 || pos === 8) A.kickAt(t, 0.28);
          if (pos % 4 === 2) A.noise(t, 0.03, 0.05, 'highpass', 7000);
          if (pos === 0) ch.tones.forEach(f => A.tone(f / 2, t, six * 15, 0.035, 'sine'));
          if (pos % 4 === 0) A.tone(ch.root, t, six * 3, 0.13, 'triangle', 500);
          if (pos % 2 === 1) A.tone(ch.tones[(i >> 1) % 3], t, six * 0.8, 0.035, 'triangle');
        }
      }
    };
    function lobbyMusic() {
      if (!prefs.music || ($('lobby').hidden && $('result').hidden)) return;
      const t = COURSES[view.course].tracks[view.track];
      if (Music.playing() && Music.mode === 'lobby') { Music.bpm = bpmOf(t); return; }
      Music.start(bpmOf(t), 'lobby');
    }

    // Half a second of silence as a WAV (8 kHz, 8-bit), made here so no file is needed
    function silentWav() {
      const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
      const w = (o, str) => [...str].forEach((c, i) => b[o + i] = c.charCodeAt(0));
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      b.fill(128, 44);

    // For tests: whether audio is running (read-only)
    window.toyboxArcadeAudio = () => (Audio.ctx ? Audio.ctx.state : 'none');

    // ---------- Loading track data ----------
    const cache = {};
    function loadScript(src, global) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => { const v = window[global]; resolve(v); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    async function loadTrack(c, t) {
      const key = c.id + '/' + t.id;
      if (cache[key]) return cache[key];
      let data;
      if (t.kind === 'sent') { window.SENTENCES = null; data = await loadScript(`../sentences/data/${t.file}.js?v=${V_SENT}`, 'SENTENCES'); }
      else if (t.kind === 'script') data = window.ARCADE_SCRIPTS || await loadScript('data/scripts.js?v=2026-10-31.1', 'ARCADE_SCRIPTS');
      else { window.ZH_LEVEL = null; data = await loadScript(`../chinese/${t.file}/data.js?v=${V_ZH}`, 'ZH_LEVEL'); }
      if (!data) throw new Error('no data');

      COUNTS[key] = buildPool(c, t, data).rows.length;
      return data;
    }

    // ---------- Questions ----------
    // Meaning columns: sentences [en, fr, zh, ja, ko]; Chinese words [hanzi, pinyin, en, fr, ja, ko]
    const SCOL = { en: 0, fr: 1, 'zh-Hans': 2, ja: 3, ko: 4 };
    const ZCOL = { en: 2, fr: 3, ja: 4, ko: 5 };
    const plain = s => s.replace(/[[\]]/g, '');
    const chunkOf = s => (s.match(/\[([^\]]+)\]/) || [, ''])[1];
    // Chengyu meanings start with the same-character idiom ("一挙両得：…"); questions show only the explanation
    const meanLang = () => (ZCOL[lang] ? lang : 'en');
    const zhMean = (r, chengyu) => { const m = r[ZCOL[lang] || 2]; return chengyu ? m.replace(/^[^:：]{1,20}[:：]\s*/, '') : m; };
    // Wrong options: distinct, and never another answer that would also be right (banned)
    function others(pool, right, n, banned) {
      const out = [], seen = new Set([right]);
      for (const v of shuffle(pool.slice())) { if (out.length === n) break; if (v && !seen.has(v) && !(banned && banned.has(v))) { seen.add(v); out.push(v); } }
      return out;
    }

      if (!prefs.music) Audio.rest();
      if (G) { G.over = true; cancelAnimationFrame(G.raf); }
      G = null;
      $('game').hidden = true; $('result').hidden = true; $('lobby').hidden = false;
      $('game').classList.remove('fever', 'fever2');
      renderLobby();
      lobbyMusic();
    }

    // ---------- Events ----------
    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-course]');
      if (tab) { view.course = Number(tab.dataset.course); view.track = 0; history.replaceState(null, '', '#' + COURSES[view.course].id); renderLobby(); return; }
      const df = e.target.closest('[data-diff]');
      if (df) { setDiff(df.dataset.diff); return; }
      const tr = e.target.closest('[data-track]');
      if (tr && suppressClick) return;
      if (tr) { const i = Number(tr.dataset.track); if (i === view.track) start(); else moveTrack(i - view.track); return; }
      if (e.target.closest('#play') || e.target.closest('#again')) { start(); return; }
      // Quitting an all-cards run shows how far it got; a 60-second round just goes back
      if (e.target.closest('#quit')) { if (G && !G.over && G.mode === 'all' && G.start) finish(true); else toLobby(); return; }
      if (e.target.closest('#back')) { toLobby(); return; }
      if (e.target.closest('#paused')) { resume(); return; }
      const md = e.target.closest('[data-mode]');
      if (md && ['time', 'all'].includes(md.dataset.mode)) { if (md.dataset.mode !== prefs.mode) { prefs.mode = md.dataset.mode; store.set(PREFS_KEY, prefs); Audio.tick(true); renderLobby(); } return; }
      if (e.target.closest('#up')) { moveTrack(-1); return; }
      if (e.target.closest('#down')) { moveTrack(1); return; }
    });
    // Lanes answer on pointer-down for a quick response
    $('lanes').addEventListener('pointerdown', e => {
      const b = e.target.closest('[data-lane]');
      Audio.init();
      if (b && G && !G.over && G.note && !G.note.done) { e.preventDefault(); judge(Number(b.dataset.lane)); }
    });
    const KEYS = { '1': 0, '2': 1, '3': 2, '4': 3, d: 0, f: 1, j: 2, k: 3 };
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('select'))) return;
      const k = e.key.toLowerCase();
      if (G && G.pausedAt) { e.preventDefault(); resume(); return; }
      if (!$('game').hidden && G && G.note && !G.note.done && k in KEYS) {
        e.preventDefault();
        const b = document.querySelector(`[data-lane="${KEYS[k]}"]`);
        if (b) { b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 90); judge(KEYS[k]); }
        return;
      }
      if (k === 'escape' && (!$('game').hidden || !$('result').hidden)) { toLobby(); return; }
      if (k === ' ' && !$('result').hidden) { e.preventDefault(); start(); return; }
      if (!$('lobby').hidden) {
        if (k === 'arrowup') { e.preventDefault(); moveTrack(-1); }
        else if (k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); setDiff(DIFF_IDS[(DIFF_IDS.indexOf(prefs.diff) + (k === 'arrowright' ? 1 : DIFF_IDS.length - 1)) % DIFF_IDS.length]); }
        else if (k === 'arrowdown') { e.preventDefault(); moveTrack(1); }
        else if ((k === 'enter' || k === ' ') && !(e.target.closest && e.target.closest('button, a'))) { e.preventDefault(); start(); }
      }
    });
    // Mouse wheel and swipe move the track wheel
    let wheelLock = 0;
    $('wheel').addEventListener('wheel', e => {
      e.preventDefault();
      const now = Date.now();
      if (now - wheelLock < 180) return;
      wheelLock = now;
      moveTrack(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });
    // Dragging the wheel steps through tracks as the finger moves, with a click per step
    const STEP_PX = 44;
    let drag = null, suppressClick = false;
    $('wheel').addEventListener('pointerdown', e => {
      Audio.init(); lobbyMusic();
      drag = { y: e.clientY, last: e.clientY, moved: false, id: e.pointerId };
    });
    $('wheel').addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved && Math.abs(e.clientY - drag.y) > 8) { drag.moved = true; try { $('wheel').setPointerCapture(e.pointerId); } catch (err) {} }
      while (Math.abs(e.clientY - drag.last) >= STEP_PX) {
        const dir = e.clientY < drag.last ? 1 : -1;
        moveTrack(dir);
        drag.last += dir === 1 ? -STEP_PX : STEP_PX;
      }
    });
    const endDrag = () => {
      if (drag && drag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 250); }
      drag = null;
    };
    $('wheel').addEventListener('pointerup', endDrag);
    $('wheel').addEventListener('pointercancel', endDrag);
    function setDiff(d) {
      if (!DIFFS[d] || d === prefs.diff) return;
      prefs.diff = d; store.set(PREFS_KEY, prefs);
      Audio.tick(true);
      if (Music.playing() && Music.mode === 'lobby') Music.bpm = bpmOf(COURSES[view.course].tracks[view.track]);
      renderLobby();
    }
    // The first tap or key press anywhere starts the lobby music (browsers need a gesture for sound)
    document.addEventListener('pointerdown', () => { Audio.init(); lobbyMusic(); });
    document.addEventListener('keydown', () => { Audio.init(); lobbyMusic(); });
    $('music-btn').addEventListener('click', () => {
      prefs.music = !prefs.music; store.set(PREFS_KEY, prefs);
      if (prefs.music) { Audio.init(); lobbyMusic(); } else Music.stop();
      renderChrome();
    });
    $('sound-btn').addEventListener('click', () => { prefs.sound = !prefs.sound; if (prefs.sound) { Audio.init(); setTimeout(() => Audio.hit(5), 60); } store.set(PREFS_KEY, prefs); renderChrome(); });
    $('calm-btn').addEventListener('click', () => { prefs.calm = !prefs.calm; store.set(PREFS_KEY, prefs); renderChrome(); });
    $('lang').addEventListener('change', e => {
      lang = e.target.value; T = I18N.ui[lang];
      try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
      renderChrome(); renderLobby();
    });
    window.addEventListener('hashchange', () => { applyHash(); if (!$('lobby').hidden) renderLobby(); });
    // Leaving the tab pauses nothing; it simply ends the round so no stale timers run
    // Leaving the tab pauses the round; a tap continues it on the next beat
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) return;
      Music.stop();
      if (G && !G.over && G.start && !G.pausedAt) {
        G.pausedAt = performance.now();
        cancelAnimationFrame(G.raf);
        $('paused').textContent = T.paused;
        $('paused').hidden = false;
      }
    });
    function resume() {
      if (!G || G.over || !G.pausedAt) return;
      Audio.init();
      const gap = performance.now() - G.pausedAt;
      G.start += gap;
      if (G.note) G.note.born += gap;
      G.pausedAt = null;
      $('paused').hidden = true;
      if (prefs.music && Audio.ctx) {
        const el = performance.now() - G.start;
        Music.start(G.bpm, 'game', Audio.ctx.currentTime + (G.beatMs - (el % G.beatMs)) / 1000);
        Music.fever = G.fever;
      }
      G.raf = requestAnimationFrame(loop);
    }

    applyHash();
    renderChrome();
    renderLobby();
  })();
  </script>
</body>
</html>
