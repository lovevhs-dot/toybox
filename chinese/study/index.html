  <link rel="stylesheet" href="../../shared/toybox.css?v=2026-10-31.11">
  <style>
    :root {
      --c: #0f8b6c;
      --c-rgb: 15, 139, 108;
      --ff-zh: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif;
    }
    body { --c-soft: rgba(var(--c-rgb), 0.13); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { cursor: default; }
    .zh { font-family: var(--ff-zh); }
    [hidden] { display: none !important; }

    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
      background: rgba(var(--bg-rgb, 247, 244, 238), 0.92);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      flex: none; width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); color: var(--text-2);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .bar-title { flex: 1; min-width: 0; }
    .bar-title strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-title span { font-size: 12px; color: var(--text-2); }

    .settings {
      max-width: 720px; margin: 0 auto; padding: 4px 16px 12px;
      display: grid; gap: 8px;
    }
    .set-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-1);
      font-size: 14px; font-weight: 600;
    }
    .set-row select { font: inherit; color: inherit; background: var(--surface-2); border: 0; border-radius: 10px; padding: 6px 10px; }
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background 0.2s; pointer-events: none; }
    .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s var(--ease); }
    .switch input:checked + span { background: var(--c); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--text); outline-offset: 2px; }
    .link-btn { color: var(--bad); font-weight: 600; font-size: 14px; }

    .page { max-width: 720px; margin: 0 auto; padding: 14px 16px 64px; }
    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); margin-bottom: 14px; }
    .tabs button { flex: 1; padding: 8px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--text-2); }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
    .progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
    .progress .meter { flex: 1; }
    .progress .meter-fill { background: var(--c); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .grid.wide { grid-template-columns: 1fr; }
    .card {
      position: relative; text-align: left; padding: 14px; border-radius: 16px;
      background: var(--surface); box-shadow: var(--shadow-1); display: grid; gap: 4px; align-content: start;
    }
    .card:hover { box-shadow: var(--shadow-2); }
    .card .zh-big { font-family: var(--ff-zh); font-size: 28px; font-weight: 600; line-height: 1.2; }
    .card .py { font-size: 14px; color: var(--c); font-weight: 600; }
    .card .mean { font-size: 14px; color: var(--text-2); }
    .card .ex { font-size: 13px; color: var(--text-3); }
    .card .tick { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; }
    .card .tick svg { width: 12px; height: 12px; }
    .card .label { font-size: 12px; font-weight: 700; color: var(--c); text-transform: none; }
    .card .sent { font-family: var(--ff-zh); font-size: 20px; }
    .card .sent b { color: var(--c); }
    .card .note { font-size: 13px; color: var(--text-2); }
    .hide-py .py { display: none; }
    .card .py-big { font-size: 26px; font-weight: 700; line-height: 1.2; }
    .card .py-ex { font-size: 14px; color: var(--c); font-weight: 600; }
    .card .py-ex .zh { color: var(--text-2); }
    .q-pyb { font-size: 48px; font-weight: 700; line-height: 1.15; }

    .quiz { display: grid; gap: 14px; }
    .q-card { padding: 22px 18px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-1); text-align: center; display: grid; gap: 8px; justify-items: center; }
    .q-label { font-size: 13px; font-weight: 700; color: var(--text-2); }
    .q-zh { font-family: var(--ff-zh); font-size: 52px; font-weight: 600; line-height: 1.15; }
    .q-sent { font-family: var(--ff-zh); font-size: 26px; line-height: 1.5; }
    .q-zh .blank { display: inline-block; min-width: 1em; border-bottom: 3px solid var(--c); color: var(--c); }
    .q-sent .blank { display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--c); color: var(--c); }
    .q-mean { font-size: 22px; font-weight: 700; }
    .q-sub { font-size: 15px; color: var(--text-2); }
    .q-py { font-size: 16px; color: var(--c); font-weight: 600; }
    .speak { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--c-soft); color: var(--c); font-weight: 700; font-size: 14px; }
    .speak svg { width: 18px; height: 18px; }
    .speak.big { padding: 18px 26px; font-size: 16px; }
    .speak.big svg { width: 28px; height: 28px; }
    .after-py { color: var(--c); font-weight: 600; }
    .opt-gloss { list-style: none; margin: 6px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
    .opt-gloss li { color: var(--text-2); }
    .opt-gloss li.is-answer { color: var(--text); font-weight: 600; }
    .opt-gloss li.is-answer::before { content: '✓ '; color: var(--good); }
    .opt-gloss .opt-py { color: var(--c); }
    .pips { display: flex; gap: 6px; margin-top: 4px; }
    .pips span { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); transition: background 0.25s, transform 0.25s var(--ease); }
    .pips .on { background: var(--good); transform: scale(1.15); }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt {
      position: relative; min-height: 64px; padding: 12px 12px 12px 34px; border-radius: 16px;
      background: var(--surface); box-shadow: var(--shadow-1); font-size: 16px; font-weight: 600; text-align: left;
      transition: transform 0.15s var(--ease);
    }
    .opt .num { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--text-3); font-weight: 700; }
    .opt.zh-opt { font-family: var(--ff-zh); font-size: 24px; }
    .opt:not(:disabled):hover { transform: translateY(-1px); }
    .opt.right { background: rgba(31, 138, 91, 0.14); box-shadow: inset 0 0 0 2px var(--good); }
    .opt.wrong { background: rgba(201, 53, 43, 0.12); box-shadow: inset 0 0 0 2px var(--bad); }
    .feedback { min-height: 24px; text-align: center; font-weight: 700; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .after { padding: 14px; border-radius: 16px; background: var(--surface-2); font-size: 14px; display: grid; gap: 4px; }
    .after .zh { font-size: 18px; }
    .next-btn { justify-self: center; padding: 12px 28px; border-radius: 999px; background: var(--c); color: #fff; font-weight: 700; }
    .hint { text-align: center; font-size: 12px; color: var(--text-3); }
    .hint kbd { font-family: inherit; padding: 1px 5px; border-radius: 5px; background: var(--surface-2); }
    @media (hover: none) { .hint { display: none; } }

    .done { text-align: center; padding: 28px 18px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-1); display: grid; gap: 10px; justify-items: center; }
    .done h2 { margin: 0; font-size: 22px; }
    .done p { margin: 0; color: var(--text-2); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .btn-solid { padding: 11px 20px; border-radius: 999px; background: var(--c); color: #fff; font-weight: 700; }
    .btn-soft { padding: 11px 20px; border-radius: 999px; background: var(--c-soft); color: var(--c); font-weight: 700; }
    .msg { text-align: center; color: var(--text-2); padding: 40px 0; }
    @media (max-width: 420px) { .q-zh { font-size: 44px; } .opt.zh-opt { font-size: 21px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
  </style>

<body>
  <header class="bar">
    <a class="icon-btn" id="back" href="../"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></a>
    <div class="bar-title"><strong id="title">Chinese</strong><span id="subtitle"></span></div>
    <button type="button" class="icon-btn" id="sound-btn"></button>
    <button type="button" class="icon-btn" id="settings-btn" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
  </header>
  <div class="settings" id="settings" hidden>
    <label class="set-row"><span id="lang-label">Language</span><select id="lang"></select></label>
    <div class="set-row"><span id="pinyin-label">Pinyin</span><label class="switch"><input type="checkbox" id="pinyin" checked aria-labelledby="pinyin-label"><span></span></label></div>
    <div class="set-row"><button type="button" class="link-btn" id="reset"></button></div>
  </div>
  <main class="page" id="page"><p class="msg">…</p></main>

  <script src="i18n.js?v=2026-10-31.5"></script>
  <script>
  (() => {
    'use strict';

    const NEED_FRESH = 2;      // correct answers in a row to master a new item
    const NEED_AFTER_MISS = 3; // after a miss
    const ACTIVE_SIZE = 5;     // items practiced at a time
    const REVIEW_SIZE = 10;
    const LANG_KEY = 'toybox-lang';
    const PREFS_KEY = 'zh-study-prefs';

    const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>';
    const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
    const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const store = {
      get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };

    // ---------- Language ----------
    const LANG_IDS = I18N.langs.map(l => l.id);
    function detectLang() {
      let stored = null;
      try { stored = localStorage.getItem(LANG_KEY); } catch (e) {}
      if (stored && LANG_IDS.includes(stored)) return stored;
      for (const l of navigator.languages || [navigator.language || 'en']) {
        const id = l.toLowerCase().split('-')[0];
        if (LANG_IDS.includes(id)) return id;
      }
      return 'en';
    }
    let lang = detectLang();
    let T = I18N.ui[lang];
    const LI = { en: 0, fr: 1, ja: 2, ko: 3 };

    // ---------- Which part ----------
    const setId = new URLSearchParams(location.search).get('set') || '';
    const m = setId.match(/^zh-(hsk[1-9]|pinyin)-(words|grammar|tones|initials|finals)-(\d{1,2})$/);
    const PINYIN_KINDS = ['tones', 'initials', 'finals'];
    const prefs = Object.assign({ pinyin: true, sound: true }, store.get(PREFS_KEY) || {});
    let D = null, kind = null, partNo = 0, items = [], storageKey = '';

    // ---------- Sound ----------
    const Sound = {
      ctx: null,
      tone(freqs, dur = 0.14, type = 'sine', gap = 0.09, vol = 0.07) {
        if (!prefs.sound) return;
        try {
          this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
          const t0 = this.ctx.currentTime;
          freqs.forEach((f, i) => {
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = type; o.frequency.value = f;
            const t = t0 + i * gap;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(this.ctx.destination);
            o.start(t); o.stop(t + dur + 0.02);
          });
        } catch (e) {}
      },
      correct() { this.tone([660, 880]); },
      wrong() { this.tone([220], 0.18, 'triangle', 0, 0.06); },
      mastered() { this.tone([660, 880, 1175], 0.18); },
      complete() { this.tone([523, 659, 784, 1047], 0.3, 'sine', 0.12); },
      voice() {
        const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
        return vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang) && !/HK|TW|yue/i.test(v.lang)) || null;
      },
      canSpeak() { return !!(window.speechSynthesis && this.voice()); },
      say(text) {
        if (!window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          const v = this.voice();
          if (v) u.voice = v;
          u.rate = 0.85;
          speechSynthesis.speak(u);
        } catch (e) {}
      }
    };
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

    // ---------- Data ----------
    function buildItems() {
      const sizes = D.parts[kind];
      if (!sizes || partNo < 1 || partNo > sizes.length) return false;
      const start = sizes.slice(0, partNo - 1).reduce((a, b) => a + b, 0);
      const rows = D[kind].slice(start, start + sizes[partNo - 1]);
      items = rows.map((r, i) => {
        if (kind === 'tones') {
          return { key: r[0], py: r[0], hz: r[1], tone: r[2], opts: r[3] };
        }
        if (kind === 'initials' || kind === 'finals') {
          return { key: r[0], label: r[0], py: r[1], hz: r[2], mean: r.slice(3, 7) };
        }
        if (kind === 'grammar') {
          return { key: `g${start + i + 1}`, label: r[0], sentence: r[1], zh: r[2], wrong: r[3], tr: r.slice(4, 8), note: r.slice(8, 12), py: r[12] || '' };
        }
        const it = { key: r[0], zh: r[0], py: r[1], mean: r.slice(2, 6) };
        return it;
      });
      return true;
    }
    const toneName = it => T.toneNames[it.tone];
    const meanOf = it => (kind === 'tones' ? toneName(it) : it.mean[LI[lang]]);
    const isPinyin = () => PINYIN_KINDS.includes(kind);
    const sayText = it => (isPinyin() ? it.hz : kind === 'grammar' ? full(it) : it.zh);
    const full = it => it.sentence.replace('＿', it.zh);

    // ---------- Progress ----------
    let mastered = new Set();
    function loadProgress() {
      const saved = store.get(storageKey) || {};
      mastered = new Set((saved.mastered || []).filter(k => items.some(it => it.key === k)));
    }
    function persist() {
      const saved = store.get(storageKey) || {};
      store.set(storageKey, Object.assign(saved, { mastered: [...mastered] }));
    }
    function markRecent() {
      try { localStorage.setItem('toybox-recent', storageKey); } catch (e) {}
    }

    // ---------- State ----------
    const state = { mode: 'list', settings: false };
    const qz = {
      active: [], streak: {}, missed: new Set(), last: null,
      current: null, type: null, options: [], answered: false, chosen: null,
      answers: 0, right: 0, review: null, seq: 0
    };

    function resetQuiz() {
      Object.assign(qz, { active: [], streak: {}, missed: new Set(), last: null, current: null, options: [], answered: false, chosen: null, answers: 0, right: 0, review: null });
    }

    function fillActive() {
      qz.active = qz.active.filter(k => !mastered.has(k));
      const pool = shuffle(items.filter(it => !mastered.has(it.key) && !qz.active.includes(it.key)).map(it => it.key));
      while (qz.active.length < ACTIVE_SIZE && pool.length) qz.active.push(pool.pop());
    }

    function questionType(it) {
      if (kind === 'grammar') return 'blank';
      const voice = Sound.canSpeak() && prefs.sound;
      if (kind === 'tones') return voice && Math.random() < 0.7 ? 'tone-listen' : 'tone-name';
      if (isPinyin()) return voice && Math.random() < 0.6 ? 'sound-listen' : 'hint';
      const types = ['meaning', 'hanzi'];
      if (kind === 'words' && Sound.canSpeak() && prefs.sound) types.push('listen');
      // Words of two or more characters also practice their characters: fill in the missing one
      if (kind === 'words' && it.zh.length > 1) types.push('complete');
      return types[Math.floor(Math.random() * types.length)];
    }

    function optionsFor(it, type) {
      if (type === 'blank') return shuffle([it.zh, ...it.wrong]);
      if (type === 'complete') {
        // Skip a character that would also make a real word in that spot
        const known = new Set(D.words.map(w => w[0]));
        const fits = c => known.has(it.zh.split(qz.blank).join(c));
        // Wrong options come from the characters of this part's words, so they look familiar
        const pool = [...new Set(items.flatMap(x => [...x.zh]))].filter(c => !it.zh.includes(c) && !fits(c));
        return shuffle([qz.blank, ...shuffle(pool).slice(0, 3)]);
      }
      if (type === 'tone-listen') return shuffle(it.opts.slice());
      if (type === 'tone-name') {
        const others = shuffle([0, 1, 2, 3, 4].filter(t => t !== it.tone && (it.tone === 0 || t !== 0))).slice(0, 3);
        return shuffle([it.tone, ...others]).map(t => T.toneNames[t]);
      }
      if (type === 'sound-listen' || type === 'hint') {
        return shuffle([it.label, ...shuffle(items.filter(x => x !== it).map(x => x.label)).slice(0, 3)]);
      }
      const byMeaning = type === 'meaning';
      const shown = x => (byMeaning ? meanOf(x) : x.zh);
      const used = new Set([shown(it)]);
      const answerMeaning = meanOf(it);
      const out = [it];
      for (const x of shuffle(items.filter(x => x !== it))) {
        if (out.length === 4) break;
        // Skip anything that could also be right (same text or same meaning)
        if (used.has(shown(x)) || meanOf(x) === answerMeaning) continue;
        used.add(shown(x));
        out.push(x);
      }
      return shuffle(out).map(shown);
    }

    function pickQuestion() {
      let it;
      if (qz.review) {
        it = qz.review.list[qz.review.i];
      } else {
        fillActive();
        if (!qz.active.length) { qz.current = null; return; }
        const choices = qz.active.filter(k => k !== qz.last);
        const key = (choices.length ? choices : qz.active)[Math.floor(Math.random() * (choices.length || qz.active.length))];
        it = items.find(x => x.key === key);
      }
      qz.current = it;
      qz.type = questionType(it);
      qz.blank = qz.type === 'complete' ? it.zh[Math.floor(Math.random() * it.zh.length)] : null;
      qz.options = optionsFor(it, qz.type);
      qz.answered = false;
      qz.chosen = null;
      qz.seq++;
      if (/listen/.test(qz.type)) setTimeout(() => Sound.say(isPinyin() ? it.hz : it.zh), 250);
    }

    function answerText(it, type) {
      if (type === 'tone-listen') return it.py;
      if (type === 'tone-name') return toneName(it);
      if (type === 'sound-listen' || type === 'hint') return it.label;
      if (type === 'complete') return qz.blank;
      return type === 'meaning' ? meanOf(it) : it.zh;
    }

    function choose(i) {
      if (qz.answered || !qz.current) return;
      const it = qz.current;
      qz.answered = true;
      qz.chosen = i;
      const ok = qz.options[i] === answerText(it, qz.type);
      if (qz.review) {
        if (ok) qz.review.score++;
        else qz.review.missed.add(it.key);
        ok ? Sound.correct() : Sound.wrong();
      } else {
        qz.answers++;
        markRecent();
        if (ok) {
          qz.right++;
          qz.streak[it.key] = (qz.streak[it.key] || 0) + 1;
          const need = qz.missed.has(it.key) ? NEED_AFTER_MISS : NEED_FRESH;
          if (qz.streak[it.key] >= need) {
            mastered.add(it.key);
            persist();
            mastered.size === items.length ? Sound.complete() : Sound.mastered();
          } else {
            Sound.correct();
          }
        } else {
          qz.streak[it.key] = 0;
          qz.missed.add(it.key);
          Sound.wrong();
        }
        qz.last = it.key;
      }
      render();
      // Say the Chinese after answering, unless the answer chime is still playing a big finish
      const seq = qz.seq;
      setTimeout(() => { if (seq === qz.seq && qz.answered) Sound.say(sayText(it)); }, ok ? 350 : 500);
    }

    function next() {
      if (!qz.answered) return;
      if (qz.review) {
        qz.review.i++;
        if (qz.review.i >= qz.review.list.length) { qz.current = null; render(); return; }
      }
      pickQuestion();
      render();
    }

    function startReview(list) {
      resetQuiz();
      qz.review = { list: shuffle(list.slice()).slice(0, REVIEW_SIZE), i: 0, score: 0, missed: new Set() };
      state.mode = 'practice';
      pickQuestion();
      render();
    }

    // ---------- Rendering ----------
    function cardHtml(it) {
      const tick = mastered.has(it.key) ? `<span class="tick" title="${esc(T.masteredBadge)}">${ICON_CHECK}</span>` : '';
      if (isPinyin()) {
        return `<button type="button" class="card" data-say="${esc(it.hz)}" aria-label="${esc(T.play)} ${esc(it.py)}">
          ${tick}
          <span class="py-big">${esc(kind === 'tones' ? it.py : it.label)}</span>
          <span class="py-ex">${kind === 'tones' ? '' : esc(it.py) + ' '}<span class="zh" lang="zh-CN">${esc(it.hz)}</span></span>
          <span class="mean">${esc(meanOf(it))}</span>
        </button>`;
      }
      if (kind === 'grammar') {
        return `<button type="button" class="card" data-say="${esc(full(it))}">
          ${tick}
          <span class="label">${esc(it.label)}</span>
          <span class="sent" lang="zh-CN">${esc(it.sentence).replace('＿', `<b>${esc(it.zh)}</b>`)}</span>
          <span class="py">${esc(it.py)}</span>
          <span class="mean">${esc(it.tr[LI[lang]])}</span>
          <span class="note">${esc(it.note[LI[lang]])}</span>
        </button>`;
      }

      return `<button type="button" class="card" data-say="${esc(it.zh)}" aria-label="${esc(T.play)} ${esc(it.zh)}">
        ${tick}
        <span class="zh-big" lang="zh-CN">${esc(it.zh)}</span>
        <span class="py">${esc(it.py)}</span>
        <span class="mean">${esc(meanOf(it))}</span>
      </button>`;
    }

    function progressHtml() {
      const pct = Math.round((mastered.size / items.length) * 100);
      const left = items.length - mastered.size;
      return `<div class="progress"><span class="meter"><span class="meter-fill" style="width:${pct}%"></span></span>
        <span>${esc(T.mastered(mastered.size, items.length))}${left ? ' · ' + esc(T.toGo(left)) : ''}</span></div>`;
    }

    function listHtml() {
      return `${progressHtml()}<div class="grid ${kind === 'grammar' ? 'wide' : ''}">${items.map(cardHtml).join('')}</div>`;
    }

    function promptHtml(it) {
      const py = prefs.pinyin && it.py ? `<span class="q-py">${esc(it.py)}</span>` : '';
      if (qz.type === 'tone-listen' || qz.type === 'sound-listen') {
        return `<span class="q-label">${esc(qz.type === 'tone-listen' ? T.qTone : T.qSound)}</span>
          <button type="button" class="speak big" data-say="${esc(it.hz)}" aria-label="${esc(T.play)}">${ICON_SPEAK}</button>`;
      }
      if (qz.type === 'tone-name') {
        return `<span class="q-label">${esc(T.qToneName)}</span>
          <span class="q-pyb">${esc(it.py)}</span><span class="q-sub zh" lang="zh-CN">${esc(it.hz)}</span>`;
      }
      if (qz.type === 'hint') {
        return `<span class="q-label">${esc(T.qHint)}</span><span class="q-mean">${esc(meanOf(it))}</span>`;
      }
      if (qz.type === 'complete') {
        // Reduplicated words (妈妈, 谢谢) blank every copy so the answer is not shown
        const shown = esc(it.zh).split(qz.blank).join(`<span class="blank">${qz.answered ? esc(qz.blank) : '&nbsp;'}</span>`);
        return `<span class="q-label">${esc(T.qComplete)}</span>
          <span class="q-zh" lang="zh-CN">${shown}</span>
          ${prefs.pinyin ? `<span class="q-py">${esc(it.py)}</span>` : ''}
          <span class="q-sub">${esc(meanOf(it))}</span>`;
      }
      if (qz.type === 'blank') {
        const sent = esc(it.sentence).replace('＿', `<span class="blank">${qz.answered ? esc(it.zh) : '&nbsp;'}</span>`);
        return `<span class="q-label">${esc(T.qBlank)}</span>
          <span class="q-sent" lang="zh-CN">${sent}</span>
          <span class="q-sub">${esc(it.tr[LI[lang]])}</span>`;
      }
      if (qz.type === 'meaning') {
        return `<span class="q-label">${esc(T.qMeaning)}</span>
          <span class="q-zh" lang="zh-CN">${esc(it.zh)}</span>${py}
          <button type="button" class="speak" data-say="${esc(it.zh)}">${ICON_SPEAK}${esc(T.play)}</button>`;
      }
      if (qz.type === 'hanzi') {
        return `<span class="q-label">${esc(T.qHanzi)}</span><span class="q-mean">${esc(meanOf(it))}</span>`;
      }
      return `<span class="q-label">${esc(T.qListen)}</span>
        <button type="button" class="speak big" data-say="${esc(it.zh)}" aria-label="${esc(T.play)}">${ICON_SPEAK}</button>`;
    }

    function afterHtml(it) {
      if (!qz.answered) return '';
      if (isPinyin()) {
        const head = kind === 'tones' ? esc(it.py) : `${esc(it.label)} · ${esc(it.py)}`;
        return `<div class="after"><span>${head} <span class="zh" lang="zh-CN">${esc(it.hz)}</span></span><span>${esc(meanOf(it))}</span></div>`;
      }
      if (kind === 'grammar') {
        const opts = qz.options.map(o => {
          const g = (D.gloss && D.gloss[o]) || [];
          const mean = g[LI[lang] + 1] || '';
          return `<li class="${o === it.zh ? 'is-answer' : ''}"><span class="zh" lang="zh-CN">${esc(o)}</span> <span class="opt-py">${esc(g[0] || '')}</span>${mean ? ` · ${esc(mean)}` : ''}</li>`;
        }).join('');
        return `<div class="after">
          <span class="zh" lang="zh-CN">${esc(full(it))}</span>
          ${it.py ? `<span class="after-py">${esc(it.py)}</span>` : ''}
          <span><strong lang="zh-CN">${esc(it.label)}</strong> · ${esc(it.note[LI[lang]])}</span>
          <ul class="opt-gloss">${opts}</ul>
        </div>`;
      }
      return `<div class="after"><span><span class="zh" lang="zh-CN">${esc(it.zh)}</span> ${esc(it.py)} · ${esc(meanOf(it))}</span></div>`;
    }

    // One dot per correct answer still needed to master this item (2, or 3 after a miss)
    function pipsHtml(it) {
      if (qz.review) return '';
      const need = qz.missed.has(it.key) ? NEED_AFTER_MISS : NEED_FRESH;
      const have = mastered.has(it.key) ? need : Math.min(qz.streak[it.key] || 0, need);
      const dots = Array.from({ length: need }, (_, i) => `<span class="${i < have ? 'on' : ''}"></span>`).join('');
      return `<span class="pips" role="img" aria-label="${esc(T.streak(have, need))}">${dots}</span>`;
    }

    function quizHtml() {
      if (!qz.current) return qz.review ? reviewDoneHtml() : doneHtml();
      const it = qz.current;
      const ans = answerText(it, qz.type);
      const zhOpts = !isPinyin() && qz.type !== 'meaning';
      const head = qz.review
        ? `<div class="progress"><span class="meter"><span class="meter-fill" style="width:${Math.round((qz.review.i / qz.review.list.length) * 100)}%"></span></span><span>${esc(T.reviewOf(qz.review.i + 1, qz.review.list.length))}</span></div>`
        : progressHtml();
      const opts = qz.options.map((o, i) => {
        let cls = 'opt' + (zhOpts ? ' zh-opt' : '');
        if (qz.answered && o === ans) cls += ' right';
        else if (qz.answered && i === qz.chosen) cls += ' wrong';
        return `<button type="button" class="${cls}" data-opt="${i}" ${qz.answered ? 'disabled' : ''} ${zhOpts ? 'lang="zh-CN"' : ''}><span class="num">${i + 1}</span>${esc(o)}</button>`;
      }).join('');
      let fb = '';
      if (qz.answered) {
        fb = qz.options[qz.chosen] === ans
          ? `<div class="feedback good" role="status">${esc(T.correct)}</div>`
          : `<div class="feedback bad" role="status">${esc(T.answer)} <span ${zhOpts ? 'class="zh" lang="zh-CN"' : ''}>${esc(ans)}</span></div>`;
      } else {
        fb = '<div class="feedback" role="status"></div>';
      }
      return `${head}<div class="quiz">
        <div class="q-card">${promptHtml(it)}${pipsHtml(it)}</div>
        <div class="options">${opts}</div>
        ${fb}
        ${afterHtml(it)}
        ${qz.answered ? `<button type="button" class="next-btn" id="next">${esc(T.next)}</button>` : ''}
        <p class="hint">${T.hint}</p>
      </div>`;
    }

    function nextPartHref() {
      const sizes = D.parts[kind];
      if (partNo < sizes.length) return `?set=zh-${D.id}-${kind}-${partNo + 1}`;
      const kinds = Object.keys(D.parts);
      const k = kinds[kinds.indexOf(kind) + 1];
      return k ? `?set=zh-${D.id}-${k}-1` : null;
    }

    function doneHtml() {
      const nextHref = nextPartHref();
      const stats = qz.answers ? `<p>${esc(T.stats(qz.answers, Math.round((qz.right / qz.answers) * 100)))}</p>` : '';
      return `<div class="done">
        <h2>${esc(T.allMastered(items.length))}</h2>${stats}
        <div class="actions">
          ${nextHref ? `<a class="btn-solid" href="${nextHref}">${esc(T.nextPart)}</a>` : ''}
          <button type="button" class="btn-soft" id="review">${esc(T.review)}</button>
          <a class="btn-soft" href="../${esc(D.id)}/">${esc(T.allParts)}</a>
        </div>
        <p>${esc(T.reviewNote)}</p>
      </div>`;
    }

    function reviewDoneHtml() {
      const r = qz.review;
      return `<div class="done">
        <h2>${esc(T.reviewScore(r.score, r.list.length))}</h2>
        <div class="actions">
          <button type="button" class="btn-solid" id="review">${esc(T.review)}</button>
          <a class="btn-soft" href="../${esc(D.id)}/">${esc(T.allParts)}</a>
        </div>
        <p>${esc(T.reviewNote)}</p>
      </div>`;
    }

    function render() {
      const page = $('page');
      document.body.classList.toggle('hide-py', !prefs.pinyin);
      if (!D) return;
      if (state.mode === 'practice' && !qz.review && !qz.current && mastered.size < items.length) pickQuestion();
      page.innerHTML = `
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-mode="list" aria-selected="${state.mode === 'list'}">${esc(T.list)}</button>
          <button type="button" role="tab" data-mode="practice" aria-selected="${state.mode === 'practice'}">${esc(T.practice)}</button>
        </div>
        ${state.mode === 'list' ? listHtml() : quizHtml()}`;
      const nb = $('next');
      if (nb) nb.focus({ preventScroll: true });
    }

    function syncChrome() {
      document.documentElement.lang = lang;
      const name = D && (typeof D.name === 'object' ? D.name[lang] : D.name);
      const title = D ? (isPinyin() ? `${name} · ${T.kinds[kind]}` : `${name} · ${T.kinds[kind]} · ${T.part(partNo)}`) : 'Chinese';
      $('title').textContent = title;
      document.title = `${title} · Toybox`;
      $('subtitle').textContent = D ? T.mastered(mastered.size, items.length) : '';
      $('back').setAttribute('aria-label', T.back);
      $('back').href = D ? `../${D.id}/` : '../';
      $('settings-btn').setAttribute('aria-label', T.settings);
      $('lang-label').textContent = T.language;
      $('pinyin-label').textContent = T.pinyin;
      $('reset').textContent = T.reset;
      $('pinyin').checked = prefs.pinyin;
      $('sound-btn').innerHTML = prefs.sound ? ICON_SOUND_ON : ICON_SOUND_OFF;
      $('sound-btn').setAttribute('aria-label', prefs.sound ? T.soundOn : T.soundOff);
      $('sound-btn').setAttribute('aria-pressed', String(prefs.sound));
      const sel = $('lang');
      sel.innerHTML = I18N.langs.map(l => `<option value="${l.id}" ${l.id === lang ? 'selected' : ''}>${l.name}</option>`).join('');
    }

    function update() { syncChrome(); render(); }

    // ---------- Events ----------
    $('page').addEventListener('click', e => {
      const tab = e.target.closest('[data-mode]');
      if (tab) {
        state.mode = tab.dataset.mode;
        if (state.mode === 'practice' && qz.review && !qz.current) resetQuiz();
        update();
        return;
      }
      const opt = e.target.closest('[data-opt]');
      if (opt) { choose(Number(opt.dataset.opt)); syncChrome(); return; }
      if (e.target.closest('#next')) { next(); return; }
      if (e.target.closest('#review')) { startReview(qz.review && qz.review.missed.size ? items.filter(it => qz.review.missed.has(it.key)) : items); return; }
      const say = e.target.closest('[data-say]');
      if (say) Sound.say(say.dataset.say);
    });

    document.addEventListener('keydown', e => {
      if (state.mode !== 'practice' || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest && e.target.closest('select, input')) return;
      if (/^[1-4]$/.test(e.key) && !qz.answered) { choose(Number(e.key) - 1); syncChrome(); e.preventDefault(); }
      else if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && qz.answered) {
        if (document.activeElement && document.activeElement.id === 'next' && e.key !== 'ArrowRight') return;
        next(); e.preventDefault();
      }
    });

    $('settings-btn').addEventListener('click', () => {
      state.settings = !state.settings;
      $('settings').hidden = !state.settings;
      $('settings-btn').setAttribute('aria-expanded', String(state.settings));
    });
    $('lang').addEventListener('change', e => {
      lang = e.target.value; T = I18N.ui[lang];
      try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
      // Meaning options were picked in the old language
      if (qz.current && !qz.answered) pickQuestion();
      update();
    });
    $('pinyin').addEventListener('change', e => { prefs.pinyin = e.target.checked; store.set(PREFS_KEY, prefs); render(); });
    $('sound-btn').addEventListener('click', () => {
      prefs.sound = !prefs.sound; store.set(PREFS_KEY, prefs);
      if (!prefs.sound && window.speechSynthesis) speechSynthesis.cancel();
      syncChrome();
    });
    $('reset').addEventListener('click', () => {
      if (!D || !window.confirm(T.confirmReset)) return;
      mastered = new Set(); persist(); resetQuiz(); update();
    });

    // ---------- Start ----------
    function fail(msg) {
      syncChrome();
      $('page').innerHTML = `<p class="msg">${esc(msg)}</p><p class="msg"><a class="btn-soft" href="../">${esc(T.back)}</a></p>`;
    }

    if (!m) { fail(T.notFound); return; }
    kind = m[2]; partNo = Number(m[3]); storageKey = `${setId}-v1`;
    const script = document.createElement('script');
    script.src = `../${m[1]}/data.js?v=2026-10-31.6`;
    script.onload = () => {
      D = window.ZH_LEVEL;
      if (!D || !buildItems()) { D = null; fail(T.notFound); return; }
      loadProgress();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      update();
    };
    script.onerror = () => fail(T.loadFailed);
    document.head.appendChild(script);
  })();
  </script>
</body>
</html>
