<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toybox</title>
  <style>
    :root {
      --bg: #fdfcfc;
      --surface: #ffffff;
      --text: #111111;
      --text-muted: rgba(0, 0, 0, 0.55);
      --stroke: #e3e3e3;
      --hover: #f2f0f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --surface: #1c1c1c;
        --text: #e0e0e0;
        --text-muted: rgba(255, 255, 255, 0.55);
        --stroke: #2d2f38;
        --hover: #2a2a2a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { margin: 0 0 20px; font-size: 26px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    a {
      display: block;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    a:hover { background: var(--hover); }
    .name { font-weight: 600; }
    .desc { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Toybox</h1>
    <ul>
      <li><a href="hiragana/"><div class="name">Hiragana Studio</div><div class="desc">Hiragana chart and quiz</div></a></li>
    </ul>
  </main>
</body>
</html>
