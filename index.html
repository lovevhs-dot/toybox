<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toybox</title>
  <meta name="description" content="Small things to play with and use.">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Toybox">
  <meta property="og:description" content="Small things to play with and use.">
  <meta property="og:url" content="https://nanyan4.github.io/toybox/">
  <meta property="og:image" content="https://nanyan4.github.io/toybox/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #fffdf9;
      --surface-2: #efebe3;
      --text: #1d1b18;
      --text-2: #6b665d;
      --text-3: #a39d92;
      --line: #e3ddd2;
      --line-strong: #cfc8bb;
      --shadow-1: 0 1px 2px rgba(40, 30, 20, 0.06);
      --shadow-2: 0 18px 40px -16px rgba(40, 30, 20, 0.22), 0 2px 6px rgba(40, 30, 20, 0.06);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151412;
        --surface: #1e1d1a;
        --surface-2: #262420;
        --text: #efebe4;
        --text-2: #aaa499;
        --text-3: #716c63;
        --line: #2e2b27;
        --line-strong: #403c36;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 18px 40px -16px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.3);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 16px 64px;
    }

    .hero { margin-bottom: 36px; }

    .logo {
      display: grid;
      grid-template-columns: repeat(2, 14px);
      gap: 4px;
      margin-bottom: 20px;
    }

    .logo span { width: 14px; height: 14px; }
    .logo span:nth-child(1) { background: #d9452b; border-radius: 4px; }
    .logo span:nth-child(2) { background: #f2b33d; border-radius: 50%; }
    .logo span:nth-child(3) { background: #3f8f6b; border-radius: 50%; }
    .logo span:nth-child(4) { background: var(--text); border-radius: 4px; }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 52px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .tagline {
      margin: 10px 0 0;
      font-size: 17px;
      color: var(--text-2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-1);
      color: inherit;
      text-decoration: none;
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-2);
      border-color: var(--line-strong);
    }

    .card:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .thumb {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      background: var(--thumb-bg);
      overflow: hidden;
    }

    .thumb-glyph {
      font-family: 'Klee One', 'Hiragino Sans', sans-serif;
      font-weight: 600;
      font-size: 84px;
      line-height: 1;
      color: var(--thumb-fg);
      transition: transform 0.4s var(--ease);
    }

    .card:hover .thumb-glyph { transform: scale(1.08) rotate(-3deg); }

    .thumb-paper {
      position: relative;
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      border: 1.5px solid color-mix(in srgb, var(--thumb-fg) 30%, transparent);
      border-radius: 6px;
      background: color-mix(in srgb, #fff 60%, transparent);
    }

    .thumb-paper::before, .thumb-paper::after {
      content: "";
      position: absolute;
    }

    .thumb-paper::before {
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1.5px dashed color-mix(in srgb, var(--thumb-fg) 30%, transparent);
    }

    .thumb-paper::after {
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 1.5px dashed color-mix(in srgb, var(--thumb-fg) 30%, transparent);
    }

    .thumb-paper .thumb-glyph { position: relative; z-index: 1; }

    .card-body {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 18px;
    }

    .card-text { flex: 1; min-width: 0; }

    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-desc {
      margin: 2px 0 0;
      font-size: 14px;
      color: var(--text-2);
    }

    .card-arrow {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-2);
      transition: background 0.2s, color 0.2s, transform 0.25s var(--ease);
    }

    .card:hover .card-arrow {
      background: var(--text);
      color: var(--bg);
      transform: translateX(2px);
    }

    .card-arrow svg { width: 16px; height: 16px; }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--text-3);
    }

    @media (max-width: 480px) {
      main { padding-top: 40px; }
      .tagline { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>Toybox</h1>
      <p class="tagline">Small things to play with and use.</p>
    </header>

    <ul class="grid">
      <li>
        <a class="card" href="hiragana/">
          <div class="thumb" style="--thumb-bg: #fbe6e1; --thumb-fg: #d9452b;">
            <div class="thumb-paper"><span class="thumb-glyph">あ</span></div>
          </div>
          <div class="card-body">
            <div class="card-text">
              <h2 class="card-title">Hiragana Studio</h2>
              <p class="card-desc">Hiragana chart and quiz</p>
            </div>
            <span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
          </div>
        </a>
      </li>
    </ul>

    <footer>More coming soon.</footer>
  </main>
</body>
</html>
